<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>v86 Emulator Demo</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #emulator {
    width: 800px;
    height: 600px;
    border: 2px solid #333;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Prevent any resizing of contents */
    overflow: hidden;
    box-sizing: border-box;
  }
  #emulator canvas {
    /* Force fixed pixel size, no scaling */
    width: 800px !important;
    height: 600px !important;
    max-width: 100%;
    max-height: 100%;
    display: block;
    background: #000;
    object-fit: contain;
  }
</style>
</head>
<body>
  <div id="emulator">
    <canvas width="800" height="600"></canvas>
    <div></div>
  </div>

  <script src="libv86.js"></script>
  <script>
    window.onload = function() {
      var emulator = new V86({
        screen_container: document.getElementById("emulator"),
        wasm_path: "v86.wasm",
        memory_size: 64 * 1024 * 1024,
        bios: { url: "bios/seabios.bin" },
        vga_bios: { url: "bios/vgabios.bin" },
        cdrom: { url: "iso/Sodium.iso" },
        autostart: true
      });
    };
  </script>
</body>
</html>
